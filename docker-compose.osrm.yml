# Self-hosted OSRM routing engine for HERO Sidekick in-app navigation.
#
# Prerequisite: build the dataset first (see scripts/setup-osrm-malaysia.sh
# or docs/osrm-setup.md). The .osrm files must exist in ./osrm-data.
#
# Start:  docker compose -f docker-compose.osrm.yml up -d
# Logs:   docker compose -f docker-compose.osrm.yml logs -f
# Stop:   docker compose -f docker-compose.osrm.yml down
#
# NOTE: If you used a different extract name (e.g. klang-valley), adjust the
# command path below accordingly.

services:
  osrm:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    container_name: osrm
    # Change "malaysia-latest" if you built a different extract.
    command: osrm-routed --algorithm mld /data/malaysia-latest.osrm
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped
